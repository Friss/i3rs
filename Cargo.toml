[workspace]
members = ["crates/i3rs-core", "crates/i3rs-app", "crates/i3rs-cli"]
resolver = "2"

[workspace.package]
version = "0.4.0"
edition = "2024"
authors = ["Friss"]
license = "MIT"
homepage = "https://github.com/Friss/i3rs"
repository = "https://github.com/Friss/i3rs"

[workspace.dependencies]
i3rs-core = { path = "crates/i3rs-core", version = "0.4.0" }
half = "2.7.1"
memmap2 = "0.9.10"
eframe = "0.35.0"
egui = "0.35.0"
egui_plot = "0.36.0"
egui-dock = { package = "egui_dock", version = "0.20.1", features = ["serde"] }
rfd = "0.17.2"
quick-xml = "0.41.0"
rustfft = "6.4.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
clap = { version = "4.5.51", features = ["derive"] }
