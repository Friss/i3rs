name: Release Main

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    outputs:
      crate_version: ${{ steps.version.outputs.crate_version }}
      crate_tag: ${{ steps.version.outputs.crate_tag }}
      app_version: ${{ steps.version.outputs.app_version }}
      app_tag: ${{ steps.version.outputs.app_tag }}
      should_publish_crates: ${{ steps.release_gate.outputs.should_publish_crates }}
      should_publish_package: ${{ steps.release_gate.outputs.should_publish_package }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          lfs: true

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2

      - name: Read versions
        id: version
        shell: bash
        run: |
          mapfile -t versions < <(python3 - <<'PY'
          import pathlib, tomllib
          workspace = tomllib.loads(pathlib.Path("Cargo.toml").read_text())
          packager = tomllib.loads(pathlib.Path("crates/i3rs-app/Packager.toml").read_text())
          print(workspace["workspace"]["package"]["version"])
          print(packager["version"])
          PY
          )
          CRATE_VERSION="${versions[0]}"
          APP_VERSION="${versions[1]}"
          echo "crate_version=$CRATE_VERSION" >> "$GITHUB_OUTPUT"
          echo "crate_tag=v$CRATE_VERSION" >> "$GITHUB_OUTPUT"
          echo "app_version=$APP_VERSION" >> "$GITHUB_OUTPUT"
          echo "app_tag=app-v$APP_VERSION" >> "$GITHUB_OUTPUT"

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: crates.io dry run
        run: |
          cargo publish -p i3rs-core --dry-run

      - name: Check whether release tags already exist
        id: release_gate
        shell: bash
        run: |
          tag_exists() {
            git ls-remote --exit-code --tags origin "refs/tags/$1" >/dev/null 2>&1
          }

          CRATE_TAG="${{ steps.version.outputs.crate_tag }}"
          APP_TAG="${{ steps.version.outputs.app_tag }}"

          if tag_exists "$CRATE_TAG"; then
            echo "should_publish_crates=false" >> "$GITHUB_OUTPUT"
            echo "Crate tag $CRATE_TAG already exists; skipping crates.io release tagging."
          else
            echo "should_publish_crates=true" >> "$GITHUB_OUTPUT"
            echo "Crate tag $CRATE_TAG does not exist yet; crates.io publish checks will continue."
          fi

          if tag_exists "$APP_TAG"; then
            echo "should_publish_package=false" >> "$GITHUB_OUTPUT"
            echo "App tag $APP_TAG already exists; skipping package/release creation."
          else
            echo "should_publish_package=true" >> "$GITHUB_OUTPUT"
            echo "App tag $APP_TAG does not exist yet; package release pipeline will continue."
          fi

  publish-crates:
    name: Publish crates.io packages
    runs-on: ubuntu-latest
    needs: verify
    if: ${{ needs.verify.outputs.should_publish_crates == 'true' }}
    permissions:
      contents: write
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2

      - name: Check crates.io token availability
        id: token
        shell: bash
        run: |
          if [ -n "${CARGO_REGISTRY_TOKEN:-}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "CARGO_REGISTRY_TOKEN is not configured; skipping crates.io publish steps."
          fi

      - name: Check which crate versions need publishing
        id: publish_gate
        if: ${{ steps.token.outputs.available == 'true' }}
        shell: bash
        run: |
          VERSION="${{ needs.verify.outputs.crate_version }}"

          check_publish_needed() {
            local crate_name="$1"
            local response
            response=$(curl -fsSL "https://crates.io/api/v1/crates/${crate_name}")
            echo "$response"

            if CRATE_NAME="$crate_name" VERSION="$VERSION" RESPONSE="$response" python3 -c "import json, os, sys; crate_name = os.environ['CRATE_NAME']; version = os.environ['VERSION']; response = json.loads(os.environ['RESPONSE']); published_versions = {entry['num'] for entry in response.get('versions', [])}; already_published = version in published_versions; print(f'{crate_name} {version} already exists on crates.io' if already_published else f'{crate_name} {version} is not published yet'); sys.exit(0 if already_published else 1)"
            then
              echo "publish-${crate_name}=false" >> "$GITHUB_OUTPUT"
            else
              echo "publish-${crate_name}=true" >> "$GITHUB_OUTPUT"
            fi
          }

          check_publish_needed i3rs-core
          sleep 5s
          check_publish_needed i3rs-cli

      - name: Publish i3rs-core
        if: ${{ steps.token.outputs.available == 'true' && steps.publish_gate.outputs['publish-i3rs-core'] == 'true' }}
        run: cargo publish -p i3rs-core

      - name: Publish i3rs-cli
        if: ${{ steps.token.outputs.available == 'true' && steps.publish_gate.outputs['publish-i3rs-cli'] == 'true' }}
        run: cargo publish -p i3rs-cli

      - name: Tag published crate release
        if: ${{ steps.token.outputs.available == 'true' }}
        shell: bash
        run: |
          TAG="${{ needs.verify.outputs.crate_tag }}"
          git tag "$TAG" "${{ github.sha }}"
          git push origin "refs/tags/$TAG"

  package:
    name: Package (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    needs: verify
    if: ${{ needs.verify.outputs.should_publish_package == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu-latest
            os: ubuntu-latest
            web: false
            format: appimage
            artifact_name: i3rs-linux
            artifact_path: dist/packager/*.AppImage
          - name: macos-latest
            os: macos-latest
            web: false
            format: "app"
            artifact_name: i3rs-macos
            artifact_path: dist/packager/*-macos-app.zip
          - name: windows-latest
            os: windows-latest
            web: false
            format: wix
            artifact_name: i3rs-windows
            artifact_path: dist/packager/*.msi
          - name: web
            os: ubuntu-latest
            web: true
            artifact_name: i3rs-web
            artifact_path: release-artifacts/i3rs-web.tar.gz
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          lfs: true

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        if: ${{ !matrix.web }}

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        if: ${{ matrix.web }}
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2

      - name: Install cargo-packager
        if: ${{ !matrix.web }}
        run: cargo install cargo-packager --locked

      - name: Install WiX
        if: ${{ !matrix.web && runner.os == 'Windows' }}
        shell: powershell
        run: choco install wixtoolset --no-progress -y

      - name: Install Trunk
        if: ${{ matrix.web }}
        run: cargo install trunk --locked

      - name: Package application
        if: ${{ !matrix.web }}
        working-directory: crates/i3rs-app
        shell: bash
        run: cargo packager --release --formats ${{ matrix.format }}

      - name: Zip macOS app bundle
        if: ${{ !matrix.web && runner.os == 'macOS' }}
        shell: bash
        run: |
          APP_PATH=$(find dist/packager -maxdepth 1 -type d -name '*.app' -print -quit)
          if [ -z "$APP_PATH" ]; then
            echo "No macOS .app bundle found in dist/packager" >&2
            exit 1
          fi

          APP_NAME=$(basename "$APP_PATH" .app)
          ZIP_PATH="dist/packager/${APP_NAME}-macos-app.zip"
          rm -f "$ZIP_PATH"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$ZIP_PATH"

      - name: Build web bundle
        if: ${{ matrix.web }}
        working-directory: crates/i3rs-app
        run: ~/.cargo/bin/trunk build --release

      - name: Archive web bundle
        if: ${{ matrix.web }}
        shell: bash
        run: |
          mkdir -p release-artifacts
          tar -C crates/i3rs-app/dist -czf release-artifacts/i3rs-web.tar.gz .

      - name: Upload packaged artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error

  github-release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs: [verify, package]
    if: ${{ needs.verify.outputs.should_publish_package == 'true' }}
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release-artifacts

      - name: Prepare asset list
        id: assets
        shell: bash
        run: |
          find release-artifacts -type f > assets.txt
          cat assets.txt

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.verify.outputs.app_tag }}
          VERSION: ${{ needs.verify.outputs.app_version }}
          TARGET: ${{ github.sha }}
        shell: bash
        run: |
          mapfile -t assets < assets.txt

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${assets[@]}" --clobber
          else
            gh release create "$TAG" "${assets[@]}" \
              --target "$TARGET" \
              --title "i3rs app v$VERSION" \
              --generate-notes
          fi
