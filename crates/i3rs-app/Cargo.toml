[package]
name = "i3rs-app"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
description = "MoTeC telemetry data analysis application"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
perf_metrics = []

[dependencies]
i3rs-core = { workspace = true }
eframe = { workspace = true }
egui = { workspace = true }
egui_plot = { workspace = true }
egui-dock = { workspace = true }
rfd = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
crossbeam-channel = "0.5.15"
pollster = "1.0.1"
log = "0.4.29"
js-sys = "0.3.94"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.117"
wasm-bindgen-futures = "0.4.67"
gloo-timers = { version = "0.4.0", features = ["futures"] }
web-sys = { version = "0.3.94", features = ["Document", "Element", "HtmlCanvasElement", "HtmlElement", "Storage", "Window"] }
