<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>i3rs Web</title>
    <link rel="icon" href="i3rs.ico" />
    <link data-trunk rel="rust" href="Cargo.toml" data-target-name="i3rs_app" />
    <link data-trunk rel="copy-file" href="packaging/icons/i3rs.ico" />
    <link data-trunk rel="copy-file" href="../../test_data/VIR_LAP.ld" />
    <link data-trunk rel="copy-file" href="../../test_data/VIR_LAP.ldx" />
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0f1115;
        color: #e8ebf0;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
      }

      body {
        position: relative;
      }

      .load-overlay {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: grid;
        place-items: center;
        padding: 1rem;
        background: rgba(15, 17, 21, 0.5);
        backdrop-filter: blur(3px);
      }

      .load-overlay[hidden] {
        display: none;
      }

      .load-modal {
        width: min(40rem, 100%);
        padding: 1rem;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 0.5rem;
        background: #171a20;
        box-shadow: 0 1.5rem 4rem rgba(0, 0, 0, 0.35);
      }

      .load-modal h1 {
        margin: 0;
        font-size: 1rem;
        font-weight: 650;
        letter-spacing: 0.02em;
      }

      .load-modal p {
        margin: 0.3rem 0 0;
        font-size: 0.9rem;
        opacity: 0.75;
      }

      .load-controls {
        margin-top: 0.75rem;
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
        align-items: end;
      }

      .load-controls label {
        display: grid;
        gap: 0.25rem;
        font-size: 0.8rem;
        opacity: 0.9;
      }

      .load-controls button {
        border: 1px solid rgba(255, 255, 255, 0.14);
        background: rgba(255, 255, 255, 0.06);
        color: inherit;
        border-radius: 0.4rem;
        padding: 0.55rem 0.85rem;
        cursor: pointer;
      }

      .load-controls button:disabled {
        opacity: 0.45;
        cursor: default;
      }

      .load-status {
        margin-top: 0.75rem;
        display: inline-flex;
        align-items: center;
        gap: 0.55rem;
        min-height: 2rem;
        padding: 0.45rem 0.7rem;
        border-radius: 999px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        background: rgba(255, 255, 255, 0.05);
        font-size: 0.82rem;
      }

      .load-status::before {
        content: "";
        width: 0.65rem;
        height: 0.65rem;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.35);
        flex: 0 0 auto;
      }

      .load-status[data-state="loading"]::before {
        background: #ffd166;
        box-shadow: 0 0 0 0 rgba(255, 209, 102, 0.55);
        animation: pulse 1.2s infinite;
      }

      .load-status[data-state="success"]::before {
        background: #4ade80;
      }

      .load-status[data-state="error"]::before {
        background: #fb7185;
      }

      .load-status-message {
        opacity: 0.92;
      }

      @keyframes pulse {
        0% {
          box-shadow: 0 0 0 0 rgba(255, 209, 102, 0.55);
        }
        70% {
          box-shadow: 0 0 0 10px rgba(255, 209, 102, 0);
        }
        100% {
          box-shadow: 0 0 0 0 rgba(255, 209, 102, 0);
        }
      }

      #i3rs-canvas {
        width: 100%;
        height: 100%;
        display: block;
      }
    </style>
  </head>
  <body>
    <canvas id="i3rs-canvas"></canvas>
    <div id="load-overlay" class="load-overlay">
      <div class="load-modal" role="dialog" aria-labelledby="load-title" aria-modal="true">
        <h1 id="load-title">Open telemetry</h1>
        <p>Select a MoTeC <code>.ld</code> file and optional <code>.ldx</code> sidecar together.</p>
        <div class="load-controls">
          <label for="session-files">
            Session files
            <input
              id="session-files"
              name="session-files"
              type="file"
              accept=".ld,.ldx"
              multiple
            />
          </label>
          <button id="load-vir-lap" type="button">Load VIR_LAP Sample</button>
        </div>
        <div id="load-status" class="load-status" data-state="idle" aria-live="polite">
          <span class="load-status-message">Web app starting...</span>
        </div>
      </div>
    </div>
    <script>
      const loadOverlay = document.getElementById("load-overlay");
      const sessionFilesInput = document.getElementById("session-files");
      const sampleButton = document.getElementById("load-vir-lap");
      const statusEl = document.getElementById("load-status");
      const statusMessageEl = statusEl.querySelector(".load-status-message");
      const bundledLdUrl = new URL("VIR_LAP.ld", window.location.href);
      const bundledLdxUrl = new URL("VIR_LAP.ldx", window.location.href);

      const readAsUint8Array = async (file) => new Uint8Array(await file.arrayBuffer());
      const readAsText = async (file) => await file.text();
      const extensionOf = (file) => file.name.split(".").pop()?.toLowerCase() ?? "";
      const waitForPaint = async () =>
        await new Promise((resolve) => requestAnimationFrame(() => requestAnimationFrame(resolve)));
      const notifyLoadState = (state) => {
        if (state.state !== "success") {
          loadOverlay.hidden = false;
        }
        window.i3rsLoadState = state;
        statusEl.dataset.state = state.state;
        statusMessageEl.textContent = state.message;
        if (typeof window.i3rsOnLoadStateChange === "function") {
          try {
            window.i3rsOnLoadStateChange(state);
          } catch (err) {
            console.error("load-state callback failed", err);
          }
        }
      };
      const setBusy = (busy) => {
        sessionFilesInput.disabled = busy;
        sampleButton.disabled = busy;
      };
      const setLoadState = (state, message, extra = {}) => {
        notifyLoadState({
          state,
          message,
          at: new Date().toISOString(),
          ...extra,
        });
      };
      const loadIntoApp = async (fileName, ldBytes, ldxText, source) => {
        if (typeof window.i3rsLoadSession !== "function") {
          throw new Error("The web app is still starting. Try again in a moment.");
        }
        setLoadState("loading", `Parsing ${fileName}...`, {
          fileName,
          source,
          phase: "parse",
        });
        await waitForPaint();
        const parseStart = performance.now();
        window.i3rsLoadSession(fileName, ldBytes, ldxText ?? null);
        const parseDurationMs = Math.round(performance.now() - parseStart);
        let summary = null;
        if (typeof window.i3rsSessionSummary === "function") {
          const raw = window.i3rsSessionSummary();
          if (raw) {
            summary = JSON.parse(raw);
          }
        }
        const loadedMessage = summary
          ? `Loaded ${summary.file_name} with ${summary.channel_count} channels and ${summary.lap_count} laps in ${parseDurationMs} ms`
          : `Loaded ${fileName} in ${parseDurationMs} ms`;
        setLoadState("success", loadedMessage, {
          fileName,
          source,
          phase: "done",
          parseDurationMs,
          summary,
        });
        await waitForPaint();
        loadOverlay.hidden = true;
        return summary;
      };

      const waitForRuntime = async () => {
        if (typeof window.i3rsLoadSession === "function") {
          setLoadState("idle", "Ready to load telemetry.");
          return;
        }

        for (let attempt = 0; attempt < 100; attempt += 1) {
          await new Promise((resolve) => setTimeout(resolve, 100));
          if (typeof window.i3rsLoadSession === "function") {
            setLoadState("idle", "Ready to load telemetry.");
            return;
          }
        }

        setLoadState("error", "Web app startup timed out.");
      };

      const loadSelectedFiles = async () => {
        const selectedFiles = Array.from(sessionFilesInput.files ?? []);
        const ldFiles = selectedFiles.filter((file) => extensionOf(file) === "ld");
        const ldxFiles = selectedFiles.filter((file) => extensionOf(file) === "ldx");
        const ldFile = ldFiles[0];
        if (!ldFile) {
          setLoadState("error", "Choose an .ld file first.");
          return;
        }
        if (ldFiles.length > 1) {
          setLoadState("error", "Choose only one .ld file.");
          return;
        }

        setBusy(true);
        try {
          setLoadState("loading", `Reading ${ldFile.name}...`, {
            fileName: ldFile.name,
            source: "file-input",
            phase: "read",
          });
          const ldBytes = await readAsUint8Array(ldFile);
          const ldxFile = ldxFiles[0];
          let ldxText = null;
          if (ldxFile) {
            setLoadState("loading", `Reading ${ldxFile.name}...`, {
              fileName: ldFile.name,
              source: "file-input",
              phase: "read-sidecar",
            });
            ldxText = await readAsText(ldxFile);
          }
          await loadIntoApp(ldFile.name, ldBytes, ldxText, "file-input");
        } catch (err) {
          console.error(err);
          setLoadState("error", `Failed to load session: ${err}`, {
            fileName: ldFile.name,
            source: "file-input",
            phase: "error",
          });
        } finally {
          setBusy(false);
        }
      };

      sessionFilesInput.addEventListener("change", () => {
        if (sessionFilesInput.files && sessionFilesInput.files.length > 0) {
          void loadSelectedFiles();
        }
      });

      sampleButton.addEventListener("click", async () => {
        setBusy(true);
        try {
          setLoadState("loading", "Fetching bundled VIR_LAP sample...", {
            fileName: "VIR_LAP.ld",
            source: "bundled-sample",
            phase: "fetch",
          });
          const [ldResponse, ldxResponse] = await Promise.all([
            fetch(bundledLdUrl),
            fetch(bundledLdxUrl),
          ]);

          if (!ldResponse.ok) {
            throw new Error(`Failed to fetch VIR_LAP.ld (${ldResponse.status})`);
          }
          if (!ldxResponse.ok) {
            throw new Error(`Failed to fetch VIR_LAP.ldx (${ldxResponse.status})`);
          }

          const [ldBuffer, ldxText] = await Promise.all([
            ldResponse.arrayBuffer(),
            ldxResponse.text(),
          ]);
          await loadIntoApp("VIR_LAP.ld", new Uint8Array(ldBuffer), ldxText, "bundled-sample");
        } catch (err) {
          console.error(err);
          setLoadState("error", `Failed to load bundled sample: ${err}`, {
            fileName: "VIR_LAP.ld",
            source: "bundled-sample",
            phase: "error",
          });
        } finally {
          setBusy(false);
        }
      });

      waitForRuntime();
    </script>
  </body>
</html>
