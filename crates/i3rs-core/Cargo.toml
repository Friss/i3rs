[package]
name = "i3rs-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
description = "MoTeC i2 .ld log file parser and data access library"
readme = "../../README.md"
keywords = ["motorsport", "telemetry", "motec", "parser", "racing"]
categories = ["parser-implementations", "science"]

[dependencies]
half = { workspace = true }
memmap2 = { workspace = true }
quick-xml = { workspace = true }
rustfft = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
lzma-rust2 = { version = "=0.22.0", default-features = false, features = ["std", "xz"] }
crc32fast = "1.5.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
sha2 = "0.11"
mdns-sd = { version = "=0.21.4", default-features = false, features = ["serde"] }
tempfile = "3.27.0"

[dev-dependencies]
criterion = "0.8"

[[bench]]
name = "perf_benches"
harness = false
